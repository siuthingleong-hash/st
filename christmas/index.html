<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;800&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
  /* Layout: one phone-width column, one moment at a time — invitation, 3 questions, guardian card.
     A deliberate single pine-night world with cranberry and gold (no light theme): it is a festive scene, not a document. */
  :root {
    color-scheme: dark;
    --pine: #0e2a22;
    --pine-2: #17402f;
    --berry: #b8323f;
    --berry-deep: #8a1f2b;
    --gold: #e9c46a;
    --snow: #f7f3ea;
    --text: #f3efe4;
    --muted: #b7c7bd;
    --ink: #1d2a25;
    --display: "Fraunces", "Noto Serif SC", Georgia, serif;
    --zh: "Noto Serif SC", "Songti SC", SimSun, serif;
    --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(110% 70% at 50% 0%, var(--pine-2) 0%, var(--pine) 65%) fixed, var(--pine);
    color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  :lang(zh) h1, :lang(zh) h2, :lang(zh) .t-display { font-family: var(--zh); }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; max-width: 440px; margin: 0 auto; min-height: 100%; display: grid; align-content: center; padding-block: 64px 32px; }
  section { display: grid; gap: 18px; text-align: center; }
  .topbar { position: fixed; z-index: 5; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 4px; }
  .pill { font: 700 13px/1 var(--body); color: var(--muted); background: rgba(255,255,255,.06); border: 1px solid rgba(233,196,106,.3); border-radius: 99px; padding: 8px 12px; cursor: pointer; }
  .pill[aria-pressed="true"] { color: var(--ink); background: var(--gold); border-color: var(--gold); }
  .eyebrow { font: 800 12px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  h1 { font: 700 clamp(28px, 8vw, 38px)/1.2 var(--display); margin: 0; text-wrap: balance; }
  h2 { font: 700 clamp(22px, 6.4vw, 28px)/1.3 var(--display); margin: 0; text-wrap: balance; }
  .hint { color: var(--muted); margin: 0; }
  .to { font: 700 clamp(20px, 6vw, 26px)/1.3 var(--display); color: var(--gold); margin: 0; overflow-wrap: anywhere; }
  .btn { justify-self: center; font: 800 16px/1 var(--body); color: var(--snow); background: linear-gradient(180deg, #cf4452, var(--berry)); border: 0; border-radius: 99px; padding: 16px 28px; cursor: pointer; box-shadow: 0 8px 22px rgba(184,50,63,.35); text-decoration: none; display: inline-block; }
  .btn.gold { color: var(--ink); background: linear-gradient(180deg, #f3d68a, var(--gold)); box-shadow: 0 8px 22px rgba(233,196,106,.25); }
  .btn.ghost { color: var(--gold); background: transparent; border: 1px solid rgba(233,196,106,.5); box-shadow: none; }
  button, .btn, .opt { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .pill:focus-visible, .btn:focus-visible, .opt:focus-visible, .check input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- intro card ---------- */
  .ornament { width: 132px; height: 132px; margin: 0 auto; max-width: 100%; }
  .card-note { background: rgba(247,243,234,.06); border: 1px solid rgba(233,196,106,.22); border-radius: 16px; padding: 18px; display: grid; gap: 10px; }

  /* ---------- questions ---------- */
  .progress { display: flex; gap: 8px; justify-content: center; }
  .progress span { width: 34px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); }
  .progress span.on { background: var(--gold); }
  .opts { display: grid; gap: 10px; text-align: left; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; font: 600 16px/1.35 var(--body); color: var(--text); background: rgba(247,243,234,.07); border: 1px solid rgba(247,243,234,.16); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; transition: background .15s, border-color .15s, transform .15s; }
  .opt .em { font-size: 24px; flex: none; }
  .opt:hover { background: rgba(233,196,106,.12); border-color: rgba(233,196,106,.5); }
  .opt.picked { background: var(--gold); color: var(--ink); border-color: var(--gold); transform: scale(.98); }

  /* ---------- result ---------- */
  .result-card { background: var(--snow); color: var(--ink); border-radius: 20px; padding: 26px 20px 20px; display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.4); position: relative; overflow: hidden; }
  .result-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: repeating-linear-gradient(90deg, var(--berry) 0 18px, var(--snow) 18px 26px, #2f6b4f 26px 44px, var(--snow) 44px 52px); }
  .badge { font-size: 64px; line-height: 1; }
  .result-card h2 { color: var(--berry-deep); }
  .result-card p { margin: 0; }
  .blessing { font: 500 17px/1.6 var(--display); white-space: pre-line; }
  :lang(zh) .blessing { font-family: var(--zh); }
  .gift { text-align: left; background: #f0e6d0; border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
  .gift b { color: var(--berry-deep); }
  .gift-label { font: 800 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: #6b5a3a; }
  .quote { font: 700 16px/1.4 var(--display); color: #2f6b4f; }
  :lang(zh) .quote { font-family: var(--zh); }
  .tips { text-align: left; background: rgba(247,243,234,.08); border: 1px dashed rgba(233,196,106,.45); border-radius: 16px; padding: 16px 16px 14px; display: grid; gap: 8px; }
  .tips-label { font: 700 16px/1.3 var(--display); color: var(--gold); }
  :lang(zh) .tips-label { font-family: var(--zh); }
  .tips ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
  .tips li::marker { color: var(--gold); font-weight: 800; }
  .check { display: flex; gap: 10px; align-items: flex-start; text-align: left; color: var(--text); background: rgba(247,243,234,.06); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--gold); flex: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .small { font-size: 12px; color: var(--muted); margin: 0; }
  .sound-tip { position: fixed; z-index: 6; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: 440px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: rgba(14,42,34,.94); border: 1px solid rgba(233,196,106,.4); color: var(--text); font-size: 14px; text-align: center; }
  .reveal { animation: pop .6s cubic-bezier(.2,.8,.3,1.2) both; }
  @keyframes pop { from { transform: scale(.85) rotate(-2deg); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } .opt { transition: none; } }
</style>

  <!-- result -->
  <section id="result" hidden>

    <div class="result-card reveal" id="rcard">
      <div class="badge" id="rEmoji"></div>

      <p class="blessing" id="rBless"></p>
      <div class="gift">

        <b id="rGift"></b>
        <span id="rTip"></span>
      </div>
      <p class="quote" data-t="quote"></p>
    </div>
    <div class="tips">
      <span class="tips-label" data-t="tipsLabel"></span>
      <ol id="rTips"></ol>
    </div>
    <label class="check" for="more">
      <input type="checkbox" id="more">
      <span id="moreLabel"></span>
    </label>
    <div class="row">
      <a class="btn gold" id="reply" target="_blank" rel="noopener" data-t="reply"></a>
      <button class="btn ghost" id="again" type="button" data-t="again"></button>
    </div>
    <p class="small" id="replyNote"></p>
    <p class="small" data-t="disclaimer"></p>
  </section>
</main>

      replyMore: ty => '\n' + ty.m + ' bila-bila masa yang sesuai 😊',
      replyNote: 'Jika butang tidak berfungsi, WhatsApp terus: +60 18-396 4019',
      disclaimer: 'Kuiz ini untuk suka-suka dan maklumat umum sahaja, bukan nasihat insurans peribadi. Perlindungan sebenar tertakluk kepada terma polisi.',
      soundTip: '🔇 Tiada muzik? Tekan butang ♪ di atas. Jika masih senyap, kuatkan volum, atau tekan ⋮ / ··· dan pilih "Buka dalam pelayar".'
    },
    en: {
      eyebrow: 'Christmas quiz', friend: 'my friend', dear: n => 'For ' + n + ' 🎄',
      title: 'Which Christmas<br>guardian are you?',
      intro: 'A more fun way to send Christmas wishes this year 😊<br>Answer 3 quick questions, find your guardian type,<br>and open a Christmas blessing made for you 🎁',
      start: 'Start the quiz ✨', time: 'About 1 minute · No login · No data collected',
      q: 'Question {n} of 3',
      qs: [
        ['On Christmas Eve, who do you most want to be with?', [['🍲', 'Family, around a steamboat dinner', 'family'], ['🛋️', 'Just me, resting and sleeping in', 'health'], ['✈️', 'Friends, on a holiday trip', 'safe'], ['🧸', 'The kids, opening presents', 'future']]],
        ['If Santa could give you only one gift, you would pick…', [['💪', 'A whole year of good health', 'health'], ['🌠', 'A dream you have held for years', 'future'], ['🏡', 'A happy, worry-free family', 'family'], ['🚗', 'Smooth, safe journeys', 'safe']]],
        ['In the new year, what do you most want to protect?', [['🛣️', 'Every trip on the road', 'safe'], ['❤️', "My family's life and peace of mind", 'family'], ['🩺', 'My own health', 'health'], ['🎓', "My kids' or my own future plans", 'future']]]
      ],
      youAre: 'Your result',
      types: {
        health: { e: '🦌', n: 'The Reindeer Guardian', d: 'You know that looking after yourself is how you keep looking after others.', b: 'Wishing you a new year full of health and energy,\ngood sleep, good food and lots of smiles.', g: 'The Health Gift · Medical cover', t: 'Hospital and treatment bills are covered, so you can focus on getting well instead of the costs.', m: "I'd like to know more about medical cards" },
        family: { e: '⭐', n: 'The Star Guardian', d: 'You are the star of your family, always thinking of the people you love.', b: 'Wishing you and your family peace, joy and togetherness,\nwith every celebration full of laughter.', g: 'The Peace-of-Mind Gift · Family protection', t: 'If accident or serious illness strikes, your family’s life and plans can carry on.', m: "I'd like to know more about family protection" },
        future: { e: '🎄', n: 'The Christmas Tree Guardian', d: 'Like a Christmas tree, you grow steadily every year and plan ahead.', b: 'May your wishes come true one by one,\nand may the new year be even better.', g: 'The Future Gift · Savings & education planning', t: 'Start early for your kids’ education or your retirement, so your dreams come closer with a plan.', m: "I'd like to know more about savings/education planning" },
        safe: { e: '🔔', n: 'The Bell Guardian', d: 'You love life and bring cheer wherever you go.', b: 'Wishing you safe travels wherever you go,\nand happy homecomings after every trip.', g: 'The Safe-Journey Gift · Accident cover', t: 'Accidents happen without warning. Accident cover means treatment costs and lost income are not yours alone to carry.', m: "I'd like to know more about accident cover" }
      },
      giftLabel: 'Your Christmas protection gift', quote: 'The best gift is peace of mind for the people you love.',
      tipsLabel: '🎁 Your new-year checklist',
      tips: {
        health: ["Check your medical card's annual limit and room & board, and whether they still fit your needs", 'Read your renewal notice and check for any premium change', 'Book a year-end health check'],
        family: ['After marriage or a new baby, check that your policy beneficiary/nomination is up to date', 'Tell your family where your policies are kept and who to contact', 'Think about how many years of living costs your family would need if your income stopped'],
        future: ['Write down 1 savings goal and amount for the new year', 'Count how many years until your child starts university', 'Set up a monthly automatic transfer to savings'],
        safe: ['Before travelling overseas, check whether you need travel insurance', 'Save your policy’s emergency hotline in your phone', 'Check your car and tyres before a long drive']
      },
      reply: 'Send my result to Estée 💬', again: 'Play again',
      replyText: (who, ty) => 'Merry Christmas, Estée! 🎄 I did the Christmas quiz and I am ' + ty.e + ' ' + ty.n + (who ? '\n— ' + who : ''),
      replyMore: ty => '\nAlso, ' + ty.m.charAt(0).toLowerCase() + ty.m.slice(1) + ' when you have time 😊',
      replyNote: "If the button doesn't respond, WhatsApp directly: +60 18-396 4019",
      disclaimer: 'This quiz is for fun and general information only, not personal insurance advice. Actual cover depends on the policy terms.',
      soundTip: '🔇 No music? Tap the ♪ button at the top. Still silent? Turn up the volume, or tap ⋮ / ··· and choose "Open in browser".'
    }
  };

  const $ = id => document.getElementById(id);
  let lang = 'zh', name = '', step = 0, answers = [], result = null;

  // personal link: <gameUrl>#<zh|en|ms>.<name in base64url>
  try {
    const m = /^#(zh|en|ms)(?:\.([A-Za-z0-9_-]+))?$/.exec(location.hash || '');
    if (m) {
      lang = m[1];
      if (m[2]) {
        const b = atob(m[2].replace(/-/g, '+').replace(/_/g, '/'));
        name = decodeURIComponent(Array.from(b, c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')).slice(0, 60);
      }
    }
  } catch (e) { name = ''; }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.querySelectorAll('[data-t]').forEach(el => { const v = t[el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
    $('to').textContent = t.dear(name || t.friend);
    if (!$('quiz').hidden) showQuestion();
    if (!$('result').hidden) showResult();
  }

  function show(id) { ['intro', 'quiz', 'result'].forEach(s => { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }

  function showQuestion() {
    const t = T[lang], q = t.qs[step];
    $('qnum').textContent = t.q.replace('{n}', step + 1);
    $('qtext').textContent = q[0];
    document.querySelectorAll('.progress span').forEach((s, i) => s.classList.toggle('on', i <= step));
    const box = $('opts'); box.innerHTML = '';
    q[1].forEach(([em, label, type], i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.id = 'opt-' + step + '-' + i;
      b.innerHTML = '<span class="em" aria-hidden="true">' + em + '</span><span></span>';
      b.lastChild.textContent = label;
      b.addEventListener('click', () => pick(b, type));
      box.appendChild(b);
    });
  }

  function pick(btn, type) {
    if (btn.disabled) return;
    $('opts').querySelectorAll('.opt').forEach(o => { o.disabled = true; });
    btn.classList.add('picked');
    ding(step);
    answers[step] = type;
    setTimeout(() => {
      if (step < 2) { step++; showQuestion(); }
      else { result = score(); show('result'); showResult(); burst(); fanfare(); }
    }, 380);
  }

  // most-picked type wins; on a tie the last answer (Q3: "what do you most want to protect") decides
  function score() {
    const c = {}; answers.forEach(a => { c[a] = (c[a] || 0) + 1; });
    const max = Math.max(...Object.values(c));
    if (max === 1) return answers[2];
    return TYPES.find(k => c[k] === max);
  }

  function showResult() {
    const t = T[lang], ty = t.types[result];
    $('rEmoji').textContent = ty.e;
    $('rName').textContent = ty.n;
    $('rDesc').textContent = ty.d;
    $('rBless').textContent = (name ? name + (lang === 'zh' ? '，' : ', ') : '') + ty.b;
    $('rGift').textContent = ty.g;
    $('rTip').textContent = ty.t;
    $('rTips').innerHTML = '';
    t.tips[result].forEach(s => { const li = document.createElement('li'); li.textContent = s; $('rTips').appendChild(li); });
    $('moreLabel').textContent = ty.m;
    $('replyNote').textContent = t.replyNote;
    updateReply();
  }

  function updateReply() {
    if (!result) return;
    const t = T[lang], ty = t.types[result];
    const text = t.replyText(name, ty) + ($('more').checked ? t.replyMore(ty) : '');
    $('reply').href = 'https://wa.me/' + ESTEE_WHATSAPP + '?text=' + encodeURIComponent(text);
  }

  $('start').addEventListener('click', () => { step = 0; answers = []; show('quiz'); showQuestion(); startMusic(); });
  $('again').addEventListener('click', () => { step = 0; answers = []; result = null; $('more').checked = false; show('intro'); });
  $('more').addEventListener('change', updateReply);
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));

  // ---------- sound ----------
  // Music and effects are synthesised once, offline, into small WAV files and played with <audio> players.
  // Phones treat <audio> as media: it plays inside WhatsApp / WeChat browsers and on an iPhone in silent mode,
  // where live Web Audio is often muted. Fallbacks: blob WAV → data: WAV → live Web Audio.
  let soundOn = true, playing = false, unlocked = false, mode = 'element', lastErr = '';
  const SR = 22050, BEAT = 0.42, LOOP = 64 * BEAT + 1.2;   // BEAT: seconds per beat (~143 bpm); LOOP: one chorus plus a short pause
  const musicEl = new Audio(), sfxEl = new Audio();
  [musicEl, sfxEl].forEach(el => { el.setAttribute('playsinline', ''); el.setAttribute('webkit-playsinline', ''); el.preload = 'auto'; });
  const clips = {};   // name -> { blob, bytes, data?, useData }

  // Jingle Bells chorus (J. L. Pierpont, 1857, public domain) as a music box, in C major.
  const N = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99 };
  const A = 'E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4';
  const TUNE = (A + ' F1 F1 F1.5 F.5 F1 E1 E1 E.5 E.5 E1 D1 D1 E1 D2 G2 ' + A + ' F1 F1 F1 F1 F1 E1 E1 E.5 E.5 G1 G1 F1 D1 C4')
    .split(' ').map(s => [N[s[0]], parseFloat(s.slice(1))]);
  const BASS = [131, 131, 131, 131, 175, 131, 196, 196, 131, 131, 131, 131, 175, 131, 196, 131];   // one root per bar

  // ----- synth helpers that work on any audio context (offline or live) -----
  function tone(ctx, dest, freq, t0, dur, vol, type) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + 0.05);
    return o;
  }
  function bells(ctx, dest, t0, vol) {   // sleigh-bell shake: a burst of bright filtered noise
    const len = Math.floor(ctx.sampleRate * 0.2), nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nb; f.type = 'highpass'; f.frequency.value = Math.min(7000, ctx.sampleRate * 0.3);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t0); s.stop(t0 + 0.2);
    return s;
  }
  function drawMusic(ctx, dest, t) {
    const nodes = [], B = BEAT;
    let at = t;
    TUNE.forEach(([f, d]) => { nodes.push(tone(ctx, dest, f, at, Math.max(d * B, 0.35), 0.07, 'sine'), tone(ctx, dest, f * 2, at, 0.25, 0.015, 'triangle')); at += d * B; });
    BASS.forEach((f, bar) => { [0, 2].forEach(b => nodes.push(tone(ctx, dest, f, t + (bar * 4 + b) * B, B * 1.6, 0.06, 'sine'))); });
    for (let b = 0; b < 64; b++) nodes.push(bells(ctx, dest, t + b * B, b % 2 ? 0.025 : 0.045));
    return nodes;
  }
  const drawDing = i => (ctx, dest, t) => [1047, 1319, 1568].slice(0, i + 1).forEach((f, k) => tone(ctx, dest, f, t + k * 0.06, 0.45, 0.06, 'sine'));
  const drawFanfare = (ctx, dest, t) => { [784, 988, 1175, 1568].forEach((f, i) => tone(ctx, dest, f, t + i * 0.09, 0.8, 0.07, 'sine')); bells(ctx, dest, t, 0.08); bells(ctx, dest, t + 0.18, 0.06); };

  // ----- render to WAV -----
  function wavBytes(buf) {
    const d = buf.getChannelData(0), n = d.length, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, buf.sampleRate, true); v.setUint32(28, buf.sampleRate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
    return new Uint8Array(b);
  }
  function renderWav(seconds, draw) {
    return new Promise((ok, fail) => {
      const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!OC) { fail(new Error('no OfflineAudioContext')); return; }
      const oc = new OC(1, Math.ceil(SR * seconds), SR), gain = oc.createGain();
      gain.gain.value = 2.2; gain.connect(oc.destination);
      draw(oc, gain, 0.05);
      oc.oncomplete = e => ok(e.renderedBuffer);
      const p = oc.startRendering(); if (p && p.then) p.then(ok, fail);
    }).then(buf => { const bytes = wavBytes(buf); return { bytes, blob: URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' })), useData: false }; });
  }
  function dataUrl(clip) {
    if (!clip.data) { let s = ''; for (let i = 0; i < clip.bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, clip.bytes.subarray(i, i + 0x8000)); clip.data = 'data:audio/wav;base64,' + btoa(s); }
    return clip.data;
  }
  const SILENT = (function () {   // 0.1s of silence, used to unlock both players inside the first tap
    const n = 2205, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 22050, true); v.setUint32(28, 22050, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let s = ''; b.forEach(x => { s += String.fromCharCode(x); }); return 'data:audio/wav;base64,' + btoa(s);
  })();

  renderWav(LOOP, (ctx, dest, t) => drawMusic(ctx, dest, t)).then(c => { clips.music = c; if (playing) startMusic(); }, e => { lastErr = 'render: ' + e.message; mode = 'live'; });
  [0, 1, 2].forEach(i => renderWav(0.7, drawDing(i)).then(c => { clips['ding' + i] = c; }, () => {}));
  renderWav(1.2, drawFanfare).then(c => { clips.fanfare = c; }, () => {});

  // ----- players -----
  function srcOf(clip) { return clip.useData ? dataUrl(clip) : clip.blob; }
  function playClip(el, name, loop) {
    const clip = clips[name]; if (!clip || !soundOn) return;
    el.dataset.clip = name;
    const src = srcOf(clip);
    if (el.src !== src) el.src = src;
    el.loop = !!loop;
    if (!loop) { try { el.currentTime = 0; } catch (e) {} }
    const p = el.play();
    if (p && p.then) p.then(() => { $('soundTip').hidden = true; }, err => { if (err.name !== 'AbortError') { lastErr = err.name; if (err.name === 'NotAllowedError') $('soundTip').hidden = false; } });
  }
  // a player that cannot load a WAV (blocked or unsupported): try the data: copy, then live Web Audio
  [musicEl, sfxEl].forEach(el => el.addEventListener('error', () => {
    const clip = clips[el.dataset.clip]; if (!clip) return;
    lastErr = 'media error ' + (el.error && el.error.code) + (clip.useData ? ' (data)' : ' (blob)');
    if (!clip.useData) { Object.values(clips).forEach(c => { c.useData = true; }); if (el === musicEl && playing) startMusic(); }
    else { mode = 'live'; if (el === musicEl && playing) { musicEl.removeAttribute('src'); startMusic(); } }
  }));

  // ----- live Web Audio (last fallback) -----
  let ac = null, liveNodes = [], liveTimer = null;
  function liveCtx() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state !== 'running') ac.resume().catch(() => {});
    return ac;
  }
  function liveLoop() {
    const a = liveCtx(); if (!a || !playing || !soundOn) return;
    const g = a.createGain(); g.gain.value = 0.9; g.connect(a.destination);
    liveNodes = drawMusic(a, g, a.currentTime + 0.05);
    liveTimer = setTimeout(liveLoop, LOOP * 1000);
  }
  function liveFx(draw) { const a = liveCtx(); if (!a || !soundOn) return; const g = a.createGain(); g.gain.value = 0.9; g.connect(a.destination); draw(a, g, a.currentTime + 0.02); }

  function startMusic() {
    if (!soundOn) return;
    playing = true;
    if (mode === 'live') { if (!liveTimer) liveLoop(); return; }
    if (clips.music) playClip(musicEl, 'music', true);   // otherwise it starts as soon as the music has been rendered
  }
  function stopMusic() {
    playing = false;
    musicEl.pause();
    clearTimeout(liveTimer); liveTimer = null;
    liveNodes.forEach(o => { try { o.stop(); } catch (e) {} }); liveNodes = [];
  }
  const ding = i => { if (mode === 'live') liveFx(drawDing(i)); else playClip(sfxEl, 'ding' + i); };
  const fanfare = () => { if (mode === 'live') liveFx(drawFanfare); else playClip(sfxEl, 'fanfare'); };

  // Phones only allow sound that starts inside a tap: on the first tap, start both players (silently) so they may play later.
  function unlock() {
    if (unlocked || !soundOn) return;
    unlocked = true;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    [musicEl, sfxEl].forEach(el => {
      if (el.src) return;
      el.src = SILENT;
      const p = el.play(); if (p && p.catch) p.catch(() => {});
    });
    liveCtx();
  }
  function firstTap(e) {
    unlock();
    if (e.target && e.target.closest && e.target.closest('#sound')) return;   // the ♪ button handles itself
    startMusic();                                                             // music begins with the first tap anywhere
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.removeEventListener(ev, firstTap, true));
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, firstTap, true));

  $('sound').addEventListener('click', () => {
    soundOn = !soundOn; $('sound').setAttribute('aria-pressed', String(soundOn)); $('sound').textContent = soundOn ? '♪ On' : '♪ Off';
    if (soundOn) { unlock(); startMusic(); } else { stopMusic(); $('soundTip').hidden = true; }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { musicEl.pause(); clearTimeout(liveTimer); liveTimer = null; return; }   // no music from a background tab
    if (playing && soundOn) startMusic();
  });

  // open the quiz link ending in #sounddiag to see which sound path this phone uses
  if (location.hash === '#sounddiag') {
    const box = document.createElement('pre');
    box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9;margin:0;padding:8px;background:#000c;color:#9f9;font:11px/1.4 monospace;border-radius:6px;white-space:pre-wrap;max-width:90vw';
    document.body.appendChild(box);
    setInterval(() => {
      box.textContent = 'mode: ' + mode + '\nmusic ready: ' + !!clips.music + (clips.music ? (clips.music.useData ? ' (data)' : ' (blob)') : '') +
        '\nplayer: ' + (musicEl.paused ? 'paused' : 'playing') + ' t=' + musicEl.currentTime.toFixed(1) + ' ready=' + musicEl.readyState +
        '\nlive ctx: ' + (ac ? ac.state : '-') + '\nlast error: ' + (lastErr || '-');
    }, 500);
  }

  // ---------- falling snow ----------
  const cv = $('snow'), cx = cv.getContext('2d');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flakes = [], W = 0, H = 0, extra = 0;
  function size() {
    const r = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0);
    flakes = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + .6, s: Math.random() * .6 + .25, w: Math.random() * 6.28 }));
  }
  function draw() {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = 'rgba(247,243,234,.8)';
    flakes.forEach(f => {
      if (!still) { f.y += f.s * (1 + extra); f.w += .01; f.x += Math.sin(f.w) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } }
      cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.29); cx.fill();
    });
    extra *= .97;
    if (!still) requestAnimationFrame(draw);
  }
  function burst() { extra = 4; }
  window.addEventListener('resize', size);
  size(); draw();

  render();
})();
</script>
