<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estée's Greetings</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=5">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
<meta name="theme-color" content="#8e1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estée 节日">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
  /* Layout: one centred column on a Christmas wine-red ground; the two games are thick gold-edged 3D cards that tilt toward the finger or mouse. */
  :root {
    color-scheme: dark;
    --wine: #3d0a14;
    --red: #8e1b2a;
    --red-hi: #b8323f;
    --gold: #e9c46a;
    --gold-deep: #a8792e;
    --cream: #fbf3e4;
    --text: #fff6e8;
    --muted: #f1d3c4;
    --card: #5c1220;
    --display: "Fraunces", "Noto Serif SC", Georgia, serif;
    --zh: "Noto Serif SC", "Songti SC", SimSun, serif;
    --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--text); font: 16px/1.55 var(--body);
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(233,196,106,.22) 0%, transparent 55%),
      radial-gradient(90% 60% at 50% 110%, rgba(184,50,63,.55) 0%, transparent 60%),
      linear-gradient(170deg, var(--red) 0%, var(--wine) 70%) fixed,
      var(--wine);
    padding: max(48px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    overflow-x: hidden;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; max-width: 460px; margin: 0 auto; display: grid; gap: 22px; text-align: center; }
  .eyebrow { font: 700 12px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 0; font: 700 clamp(28px, 8vw, 38px)/1.2 var(--zh); text-wrap: balance; text-shadow: 0 2px 0 var(--gold-deep), 0 8px 24px rgba(0,0,0,.35); }
  p { margin: 0; color: var(--muted); }

  /* ---------- 3D cards ---------- */
  .doors { display: grid; gap: 22px; perspective: 900px; padding-block: 6px 10px; }
  a.door {
    --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 30%;
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; text-align: left;
    text-decoration: none; color: var(--text); padding: 20px 18px; border-radius: 20px;
    background: linear-gradient(150deg, #7a1828 0%, var(--card) 55%, #45101a 100%);
    border: 1.5px solid rgba(233,196,106,.65);
    transform-style: preserve-3d;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    /* the card's "thickness": stacked gold edges below it, then a soft floor shadow */
    box-shadow: 0 1px 0 #c99a3e, 0 2px 0 #b98a34, 0 3px 0 #a8792e, 0 4px 0 #946a27, 0 5px 0 #7e5a21, 0 6px 0 #6a4b1b,
      0 18px 28px rgba(20,0,4,.55), inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .25s ease-out, box-shadow .25s ease-out;
    animation: float 5s ease-in-out infinite;
    will-change: transform;
  }
  a.door:nth-child(2) { animation-delay: -2.5s; }
  a.door.active { animation: none; transition: transform .06s linear; }
  /* light that follows the finger across the card */
  a.door::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255,236,190,.28), transparent 55%); }
  a.door:hover, a.door:focus-visible { border-color: var(--gold); }
  a.door:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  a.door:active { box-shadow: 0 1px 0 #c99a3e, 0 2px 0 #a8792e, 0 3px 0 #7e5a21, 0 8px 14px rgba(20,0,4,.5); }
  .icon { grid-row: span 2; font-size: 46px; line-height: 1; transform: translateZ(44px); filter: drop-shadow(0 8px 8px rgba(0,0,0,.35)); }
  .name { font: 700 20px/1.3 var(--zh); color: var(--cream); transform: translateZ(30px); }
  .desc { font-size: 14px; color: var(--muted); transform: translateZ(18px); }
  .go { position: absolute; right: 16px; top: 16px; font: 700 12px/1 var(--body); letter-spacing: .08em; color: var(--wine); background: var(--gold); border-radius: 99px; padding: 6px 10px; transform: translateZ(36px); }
  @keyframes float { 0%, 100% { transform: rotateX(4deg) rotateY(-6deg) translateY(0); } 50% { transform: rotateX(-3deg) rotateY(6deg) translateY(-4px); } }

  .sign { font: 600 15px/1 var(--display); color: var(--gold); letter-spacing: .04em; }

  .team { justify-self: center; font: 700 15px/1.3 var(--body); color: var(--wine); background: var(--gold); border-radius: 99px; padding: 12px 18px; text-decoration: none; }
  .team:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

  /* ---------- install to home screen ---------- */
  .install { display: grid; gap: 10px; justify-items: center; background: rgba(61,10,20,.55); border: 1px dashed rgba(233,196,106,.55); border-radius: 16px; padding: 16px; }
  .install b { color: var(--cream); font: 700 16px/1.3 var(--zh); }
  .install p { font-size: 14px; }
  .install-btn { font: 800 15px/1 var(--body); color: var(--wine); background: linear-gradient(180deg, #f3d68a, var(--gold)); border: 0; border-radius: 99px; padding: 13px 22px; cursor: pointer; box-shadow: 0 4px 0 var(--gold-deep); }
  .install-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-deep); }
  .install-btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { a.door { animation: none; transition: none; } }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <div class="eyebrow">Genuine Advisor</div>
  <h1>Estée 的节日小游戏</h1>
  <p>选一个玩玩看，约 1 分钟，不需要登录 😊</p>
  <div class="doors">
    <a class="door" href="christmas/#zh">
      <span class="icon" aria-hidden="true">🎄</span>
      <span class="name">圣诞小测验</span>
      <span class="desc">你是哪一种圣诞守护者？Christmas quiz · Kuiz Krismas</span>
      <span class="go" aria-hidden="true">PLAY</span>
    </a>
    <a class="door" href="birthday/#zh">
      <span class="icon" aria-hidden="true">🎂</span>
      <span class="name">生日惊喜</span>
      <span class="desc">打开信封，玩一个生日小游戏 · Birthday surprise · Kejutan hari jadi</span>
      <span class="go" aria-hidden="true">PLAY</span>
    </a>
  </div>
  <div class="sign">— Estée, Your Genuine Advisor</div>
  <a class="team" href="team/">👥 团队成员：生成我的专属链接 →</a>
  <section class="install" id="install">
    <b>📲 把小游戏加到手机主屏幕</b>
    <button class="install-btn" id="installBtn" type="button" hidden>安装到手机</button>
    <p id="installHow"></p>
  </section>
</main>
<script>
(function () {
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 3D tilt: each card leans toward the finger or mouse ----------
  document.querySelectorAll('a.door').forEach(card => {
    function tilt(x, y) {
      const r = card.getBoundingClientRect();
      const px = Math.min(1, Math.max(0, (x - r.left) / r.width)), py = Math.min(1, Math.max(0, (y - r.top) / r.height));
      card.classList.add('active');
      card.style.setProperty('--ry', ((px - 0.5) * 22).toFixed(2) + 'deg');
      card.style.setProperty('--rx', ((0.5 - py) * 18).toFixed(2) + 'deg');
      card.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      card.style.setProperty('--my', (py * 100).toFixed(1) + '%');
    }
    function reset() {
      card.classList.remove('active');
      ['--rx', '--ry'].forEach(p => card.style.setProperty(p, '0deg'));
      card.style.setProperty('--mx', '50%'); card.style.setProperty('--my', '30%');
    }
    if (still) return;
    card.addEventListener('pointermove', e => tilt(e.clientX, e.clientY));
    card.addEventListener('pointerdown', e => tilt(e.clientX, e.clientY));
    ['pointerleave', 'pointercancel', 'blur'].forEach(ev => card.addEventListener(ev, reset));
  });

  // ---------- falling snow ----------
  const cv = document.getElementById('snow'), cx = cv.getContext('2d');
  let flakes = [], W = 0, H = 0;
  function size() {
    const d = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    flakes = Array.from({ length: Math.round(W * H / 11000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .6, s: Math.random() * .5 + .2, w: Math.random() * 6.28 }));
  }
  function draw() {
    cx.clearRect(0, 0, W, H); cx.fillStyle = 'rgba(255,246,232,.75)';
    flakes.forEach(f => {
      if (!still) { f.y += f.s; f.w += .01; f.x += Math.sin(f.w) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } }
      cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.29); cx.fill();
    });
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', size); size(); draw();

  // ---------- install as a phone app ----------
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const box = document.getElementById('install'), btn = document.getElementById('installBtn'), how = document.getElementById('installHow');
  const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const inApp = /WhatsApp|FBAN|FBAV|Instagram|Line\/|MicroMessenger|; wv\)/.test(ua);
  if (installed) box.hidden = true;
  else if (inApp) how.textContent = '请先点右上角 ⋮ 或 ··· ，选择「在浏览器打开」（iPhone 用 Safari，Android 用 Chrome），再回来这里安装。';
  else if (ios) how.innerHTML = '在 Safari 点下方的 <b>分享 ⬆️</b>，往下滑，选 <b>「添加到主屏幕」</b>，再点 <b>添加</b>。';
  else how.textContent = '用 Chrome 打开：点右上角 ⋮ ，选「安装应用」或「添加到主屏幕」。';
  let prompt = null;
  window.addEventListener('beforeinstallprompt', e => {   // Android Chrome / Edge / desktop Chrome: one-tap install
    e.preventDefault(); prompt = e;
    btn.hidden = false; how.textContent = '点一下按钮，就会出现在手机主屏幕，像 app 一样打开。';
  });
  btn.addEventListener('click', async () => {
    if (!prompt) return;
    prompt.prompt();
    const choice = await prompt.userChoice.catch(() => null);
    prompt = null; btn.hidden = true;
    if (choice && choice.outcome === 'accepted') how.textContent = '安装好了！在手机主屏幕找「Estée 节日」🎄';
  });
  window.addEventListener('appinstalled', () => { box.hidden = true; });
})();
</script>
</body>
</html>
