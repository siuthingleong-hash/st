<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estée's Greetings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
  /* Layout: one centred column with two doorways — the Christmas quiz and the birthday game. Night sky shared by both games. */
  :root {
    color-scheme: dark;
    --night: #101a33; --pine: #0e2a22; --gold: #e6c27a; --cream: #fbf3e4; --text: #f6efe3; --muted: #b9b3c9; --berry: #b8323f;
    --display: "Fraunces", "Noto Serif SC", Georgia, serif;
    --zh: "Noto Serif SC", "Songti SC", SimSun, serif;
    --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: linear-gradient(160deg, var(--night) 0%, var(--pine) 100%) fixed, var(--night); color: var(--text);
    font: 16px/1.55 var(--body);
    padding: max(48px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  main { max-width: 460px; margin: 0 auto; display: grid; gap: 22px; text-align: center; }
  .eyebrow { font: 700 12px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 0; font: 600 clamp(28px, 8vw, 38px)/1.2 var(--zh); text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  .doors { display: grid; gap: 14px; }
  a.door { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; text-align: left; text-decoration: none; color: var(--text);
    background: rgba(251,243,228,.06); border: 1px solid rgba(230,194,122,.3); border-radius: 18px; padding: 18px; transition: background .15s, border-color .15s; }
  a.door:hover { background: rgba(230,194,122,.12); border-color: var(--gold); }
  a.door:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .icon { grid-row: span 2; font-size: 40px; line-height: 1; }
  .name { font: 600 19px/1.3 var(--zh); }
  .desc { font-size: 14px; color: var(--muted); }
  .sign { font: 600 15px/1 var(--display); color: var(--gold); letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { a.door { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Genuine Advisor</div>
  <h1>Estée 的节日小游戏</h1>
  <p>选一个玩玩看，约 1 分钟，不需要登录 😊</p>
  <div class="doors">
    <a class="door" href="christmas/#zh">
      <span class="icon" aria-hidden="true">🎄</span>
      <span class="name">圣诞小测验</span>
      <span class="desc">你是哪一种圣诞守护者？Christmas quiz · Kuiz Krismas</span>
    </a>
    <a class="door" href="birthday/#zh">
      <span class="icon" aria-hidden="true">🎂</span>
      <span class="name">生日惊喜</span>
      <span class="desc">打开信封，玩一个生日小游戏 · Birthday surprise · Kejutan hari jadi</span>
    </a>
  </div>
  <div class="sign">— Estée, Your Genuine Advisor</div>
</main>
</body>
</html>
